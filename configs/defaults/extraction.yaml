# Default extraction parameters for Bergamo two-photon microscope.
# Ports setParams('summarize_LoCo') and setParamsExtractTrial from MATLAB.

microscope: bergamo
sigma_px: 1.33
nmf_iter: 2
dXY: 3
lambda_param: null       # null = auto-estimate from data
denoise_window_s: 0.2
baseline_window_glu_s: 4.0
baseline_window_ca_s: 4.0
activity_channel: 1      # 1-indexed channel with glutamate signal
tau_s: 0.03
max_synapse_density: 0.01
n_parallel_workers: 12
motion_thresh: 2.5
nan_thresh: 0.33
discard_initial_s: 0.0
block_size: 600
sel_radius_factor: 2.0
analyze_hz: 0.0         # 0 = use full framerate
cross_trial_maxshift: 5
valid_trial_corr_min: 0.90
