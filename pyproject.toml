[project]
name = "subcell"
version = "0.1.0"
description = "Synaptic signal extraction from two-photon Bergamo imaging data"
# masknmf (the viewer's imgui widgets) caps at <3.14 and mbo_utilities floors
# at 3.12.7; the extraction/registration core alone still runs on 3.10.
requires-python = ">=3.12.7,<3.14"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "bottleneck>=1.3",
    "tifffile>=2023.1",
    "zarr>=3.0",
    "numcodecs>=0.13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
viewer = [
    "panel>=1.3",
    "bokeh>=3.3",
    "h5py>=3.8",
]
examples = [
    "matplotlib>=3.5",
    "jupyter",
    "panel>=1.3",
    "bokeh>=3.3",
    "h5py>=3.8",
]
mbo = [
    "mbo-utilities",
]
vis = [
    "fastplotlib>=0.6",
    "imgui-bundle>=1.6",
    "masknmf",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
subcell = "subcell.cli:cli"

[project.entry-points."mbo_utilities.pipelines"]
subcell = "subcell.mbo:SubcellPipelineWidget"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["subcell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# napari's pytest plugin swaps in a LogRecord factory that stringifies numpy
# scalars, which breaks %d log formatting inside the pipeline when it is installed
addopts = "-p no:napari"
markers = [
    "slow: runs the real registration and NMF on a synthetic movie",
]

[tool.ruff]
target-version = "py310"
# examples/ is exploratory notebooks; docs/ quotes code verbatim for comparison.
extend-exclude = ["examples", "docs"]

[tool.ruff.lint]
ignore = [
    # int(round(x)) is deliberate: numpy scalars must be cast before use as indices.
    "RUF046",
]

# uv-only (pip never sees these). masknmf is not on PyPI, and the viewer needs
# the branch carrying masknmf.visualization.imgui's label/table/stroke widgets.
# mbo_utilities comes from the sibling checkout: the PyPI package of that name
# owns the same import package and pins the pre-ndwidget graphics stack.
# pip users install these two before this package.
[tool.uv.sources]
masknmf = { git = "https://github.com/apasarkar/masknmf-toolbox.git", rev = "imgui-traces" }
utilities = { path = "../utilities", editable = true }

[tool.uv]
# `uv run` and `uv sync` land on the full viewer stack with no flags.
default-groups = ["vis", "mbo", "examples", "dev"]

# Mirrors the optional-dependencies above, because uv only auto-installs
# groups, not extras. pip users get the same set through the extras.
[dependency-groups]
vis = ["fastplotlib>=0.6", "imgui-bundle>=1.6", "masknmf"]
examples = ["matplotlib>=3.5", "jupyter", "panel>=1.3", "bokeh>=3.3", "h5py>=3.8"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
# mbo_utilities: readers for non-TIFF sources, and the mbo studio pipelines
# dropdown entry point. Its distribution is named `utilities`, not the import
# package `mbo_utilities`.
mbo = ["utilities"]
